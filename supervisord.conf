[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid

[program:pasargad]
directory=/app/pasargad
command=python3 main.py
autostart=true
autorestart=true
stderr_logfile=/var/log/pasargad.err.log
stdout_logfile=/var/log/pasargad.out.log

[program:caddy]
directory=/app
command=caddy run --config /app/Caddyfile --adapter caddyfile
autostart=true
autorestart=true
stderr_logfile=/var/log/caddy.err.log
stdout_logfile=/var/log/caddy.out.log